# IndiaWorks Unified SaaS GraphQL Schema v7
# Product-facing contract. Canonical DB remains normalized; resolvers enforce tenancy,
# candidate privacy, subscription entitlements and idempotency.
# This is a conceptual contract for story implementation. The final runtime schema is
# produced by Hot Chocolate code-first types/resolvers; do not hand-edit generated client code.
# Later "extend" sections are retained to show approved additions without creating a second API.

scalar Date
scalar DateTime
scalar Decimal
scalar JSON

# ----- Shared enums -----
enum UserType {
  CANDIDATE
  EMPLOYER
  ADMIN
}
enum OrganisationRole {
  OWNER
  ADMIN
  RECRUITER
  VIEWER
  BILLING_ADMIN
}
enum WorkMode {
  ONSITE
  FIELD
  REMOTE
  HYBRID
  HOME_BASED
}
enum EngagementType {
  FULL_TIME
  PART_TIME
  CONTRACT
  TEMPORARY
  GIG
  PLATFORM_GIG
  APPRENTICESHIP
  INTERNSHIP
  FREELANCE
}
enum JobPostingStatus {
  DRAFT
  PUBLISHED
  PAUSED
  FILLED
  CLOSED
  EXPIRED
}
enum HiringUrgency {
  IMMEDIATE
  WITHIN_7_DAYS
  WITHIN_30_DAYS
  WITHIN_90_DAYS
  FLEXIBLE
}
enum RequirementLevel {
  REQUIRED
  PREFERRED
  OPTIONAL
}
enum ApplicationGate {
  BLOCK
  WARN
  NONE
}
enum ApplicationStatus {
  APPLIED
  VIEWED
  SHORTLISTED
  CONTACTED
  INTERVIEW_SCHEDULED
  OFFERED
  HIRED
  REJECTED
  WITHDRAWN
  EXPIRED
}
enum CandidateDiscoverability {
  PRIVATE
  APPLIED_JOBS_ONLY
  SEARCHABLE_VERIFIED_EMPLOYERS
}
enum EligibilityStatus {
  ELIGIBLE
  ELIGIBLE_WITH_WARNINGS
  BLOCKED
  UNKNOWN
}
enum BillingInterval {
  TRIAL
  MONTHLY
  YEARLY
  ONE_TIME
}
enum SubscriptionStatus {
  TRIALING
  ACTIVE
  PAST_DUE
  SUSPENDED
  CANCEL_AT_PERIOD_END
  CANCELLED
  EXPIRED
}
enum EntitlementUnit {
  BOOLEAN
  COUNT
  CREDIT
  SEAT
  GB
  API_CALL
}
enum ResetCadence {
  NONE
  DAILY
  MONTHLY
  YEARLY
  BILLING_PERIOD
}
enum PromotionStatus {
  SCHEDULED
  ACTIVE
  PAUSED
  COMPLETED
  CANCELLED
}
enum ContactChannel {
  CALL
  WHATSAPP
  CHAT
  SMS
}
enum AlertChannel {
  PUSH
  SMS
  WHATSAPP
  EMAIL
}
enum AlertFrequency {
  INSTANT
  DAILY
  WEEKLY
  CUSTOM
}
enum JobSort {
  RELEVANCE
  NEWEST
  SALARY_HIGH_TO_LOW
  DISTANCE
}

# ----- Identity -----
type OtpChallengeResult {
  challengeId: ID!
  expiresAt: DateTime!
  resendAvailableAt: DateTime!
}
type AuthSession {
  accessToken: String!
  refreshToken: String!
  activePersona: UserType!
  availablePersonas: [UserType!]!
  sessionId: ID!
  nextRoute: String!
}

# ----- Taxonomy -----
type JobFamily {
  id: ID!
  code: String!
  name: String!
}
type Role {
  id: ID!
  code: String!
  canonicalName: String!
  family: JobFamily!
}
type Specialisation {
  id: ID!
  code: String!
  name: String!
  role: Role!
}
type WorkContext {
  id: ID!
  code: String!
  name: String!
}
type Geography {
  id: ID!
  type: String!
  code: String
  name: String!
  parent: Geography
}
type Skill {
  id: ID!
  code: String!
  canonicalName: String!
  skillType: String!
}

# ----- Organisation / SaaS -----
type Organisation {
  id: ID!
  legalName: String!
  tradeName: String
  employerSector: String
  employeeBand: String
  verificationStatus: String!
  myRole: OrganisationRole
}
type OrganisationMembership {
  organisation: Organisation!
  role: OrganisationRole!
  status: String!
}

type SubscriptionPlan {
  id: ID!
  code: String!
  name: String!
  description: String
  versions: [SubscriptionPlanVersion!]!
}
type SubscriptionPlanVersion {
  id: ID!
  interval: BillingInterval!
  currency: String!
  amount: Decimal
  trialDays: Int
  entitlements: [PlanEntitlement!]!
}
type PlanEntitlement {
  code: String!
  name: String!
  unit: EntitlementUnit!
  enabled: Boolean!
  limit: Decimal
  resetCadence: ResetCadence!
}
type EntitlementUsage {
  code: String!
  used: Decimal!
  limit: Decimal
  remaining: Decimal
  resetAt: DateTime
}
type OrganisationSubscription {
  id: ID!
  organisation: Organisation!
  status: SubscriptionStatus!
  planVersion: SubscriptionPlanVersion!
  trialEndsAt: DateTime
  currentPeriodStart: DateTime
  currentPeriodEnd: DateTime
  cancelAtPeriodEnd: Boolean!
  usage: [EntitlementUsage!]!
}
type CheckoutSession {
  id: ID!
  provider: String!
  redirectUrl: String!
  expiresAt: DateTime
}
type BillingInvoice {
  id: ID!
  number: String
  status: String!
  currency: String!
  total: Decimal!
  createdAt: DateTime!
  paidAt: DateTime
}

# ----- Jobs -----
type JobPosting {
  id: ID!
  organisation: Organisation!
  status: JobPostingStatus!
  role: Role!
  specialisation: Specialisation
  workContext: WorkContext
  engagementType: EngagementType!
  workMode: WorkMode!
  vacancyCount: Int!
  hiringUrgency: HiringUrgency!
  targetStartDate: Date
  applicationCloseDate: Date
  description: String!
  compensation: CompensationPackage!
  locations: [JobLocation!]!
  activePromotion: JobPromotion
  createdAt: DateTime!
  publishedAt: DateTime
}
type JobLocation {
  geography: Geography
  addressLine1: String
  postalCode: String
  latitude: Decimal
  longitude: Decimal
  candidateRadiusKm: Decimal
  isPrimary: Boolean!
}
type CompensationPackage {
  currency: String!
  payFrequency: String!
  fixedMin: Decimal
  fixedMax: Decimal
  grossMin: Decimal
  grossMax: Decimal
  displayedInHandMin: Decimal
  displayedInHandMax: Decimal
  components: [CompensationComponent!]!
}
type CompensationComponent {
  componentType: String!
  minAmount: Decimal
  maxAmount: Decimal
  frequency: String
  description: String
}

type PromotionProduct {
  id: ID!
  code: String!
  name: String!
  placementType: String!
  defaultDurationHours: Int!
  creditCost: Decimal
  maxBoost: Decimal!
}
type JobPromotion {
  id: ID!
  job: JobPosting!
  product: PromotionProduct!
  status: PromotionStatus!
  startsAt: DateTime!
  endsAt: DateTime!
  source: String!
  boost: Decimal!
}

# ----- Candidate -----
type CandidateProfile {
  id: ID!
  displayName: String
  onboardingState: String!
  profileCompletenessPct: Int!
  discoverabilityStatus: CandidateDiscoverability!
  defaultLocation: Geography
  occupations: [CandidateOccupation!]!
  preferences: CandidateWorkPreference
}
type CandidateOccupation {
  role: Role!
  specialisation: Specialisation
  isPrimary: Boolean!
  isCurrent: Boolean!
  experienceMonths: Int!
}
type CandidateWorkPreference {
  engagementTypes: [EngagementType!]!
  workModes: [WorkMode!]!
  expectedMonthlyMin: Decimal
  expectedMonthlyMax: Decimal
  noticePeriodDays: Int
  willingToRelocate: Boolean
}

type MaskedCandidateCard {
  id: ID!
  displayName: String
  primaryOccupation: CandidateOccupation
  skills: [Skill!]!
  experienceMonths: Int!
  approximateLocation: Geography
  availabilityText: String
  verificationFlags: [String!]!
  match: CandidateJobMatch
}
type RevealedCandidateContact {
  candidateId: ID!
  phone: String
  email: String
  revealedAt: DateTime!
  usageEventId: ID!
}

# ----- Matching -----
type MatchIssue {
  code: String!
  field: String
  message: String!
  action: String
}
type CandidateJobMatch {
  status: EligibilityStatus!
  score: Decimal
  hardBlocks: [MatchIssue!]!
  warnings: [MatchIssue!]!
  missingFields: [MatchIssue!]!
  reasons: [String!]!
  promotionApplied: Boolean!
}

# ----- Applications -----
type CandidateApplication {
  id: ID!
  job: JobPosting!
  candidate: CandidateProfile!
  status: ApplicationStatus!
  appliedAt: DateTime!
  lastStatusAt: DateTime!
}
type ApplicationEvent {
  id: ID!
  type: String!
  actorType: String!
  occurredAt: DateTime!
  details: JSON
}

# ----- Pagination -----
type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}
type JobFeedEdge {
  cursor: String!
  node: JobPosting!
  match: CandidateJobMatch
}
type JobFeedConnection {
  edges: [JobFeedEdge!]!
  pageInfo: PageInfo!
}
type CandidateSearchEdge {
  cursor: String!
  node: MaskedCandidateCard!
}
type CandidateSearchConnection {
  edges: [CandidateSearchEdge!]!
  pageInfo: PageInfo!
  usage: EntitlementUsage
}
type CandidateApplicationEdge {
  cursor: String!
  node: CandidateApplication!
}
type CandidateApplicationConnection {
  edges: [CandidateApplicationEdge!]!
  pageInfo: PageInfo!
}

# ----- Inputs: organisation/billing -----
input CreateOrganisationInput {
  legalName: String!
  tradeName: String
  employerSector: String
  employeeBand: String
  nic2025Code: String
}
input StartTrialInput {
  organisationId: ID!
  planCode: String!
}
input CreateCheckoutInput {
  organisationId: ID!
  planVersionId: ID!
  successUrl: String!
  cancelUrl: String!
  idempotencyKey: String!
}
input ChangePlanInput {
  organisationId: ID!
  planVersionId: ID!
  effective: String = "NEXT_RENEWAL"
  idempotencyKey: String!
}

# ----- Inputs: job -----
input JobLocationInput {
  geographyId: ID
  addressLine1: String
  addressLine2: String
  postalCode: String
  latitude: Decimal
  longitude: Decimal
  candidateRadiusKm: Decimal
  isPrimary: Boolean = false
}
input JobExperienceRequirementInput {
  policy: String!
  minMonths: Int
  maxMonths: Int
