# =============================================================================
# v7 organisation candidate access/paywall additions
# =============================================================================

enum CandidateAccessDecision {
  MASKED_ONLY
  ALREADY_UNLOCKED
  FREE_UNLOCK_AVAILABLE
  FREE_UNLOCKED
  PAID_UNLOCKED
  PAYWALL_REQUIRED
  BLOCKED_BY_PRIVACY
  BLOCKED_BY_POLICY
}

enum CandidateUnlockSource {
  FREE_ALLOWANCE
  PAID_ENTITLEMENT
  ADD_ON
  ADMIN
}

type CandidateAccessStatus {
  organisationId: ID!
  freeLimit: Int!
  freeUsed: Int!
  freeRemaining: Int!
  freeAllowanceExhausted: Boolean!
  paidAccessActive: Boolean!
  subscriptionStatus: SubscriptionStatus
  candidateUnlockEntitlement: EntitlementUsage
  paywallActive: Boolean!
}

type UnlockedCandidateProfile {
  id: ID!
  displayName: String
  occupations: [CandidateOccupation!]!
  skills: [Skill!]!
  experienceMonths: Int!
  location: Geography
  languages: [String!]!
  verificationFlags: [String!]!
  availabilityText: String
  profileCompletenessPct: Int!
  contactRevealAvailable: Boolean!
}

type CandidateUnlockResult {
  decision: CandidateAccessDecision!
  source: CandidateUnlockSource
  candidate: UnlockedCandidateProfile
  accessStatus: CandidateAccessStatus!
  usageEventId: ID
  paywallCode: String
  paywallMessage: String
  upgradePlanCodes: [String!]!
}

extend type MaskedCandidateCard {
  accessDecision: CandidateAccessDecision!
  alreadyUnlocked: Boolean!
}

type JobApplicantEdgeV7 {
  cursor: String!
  application: CandidateApplication!
  candidate: MaskedCandidateCard!
}

type JobApplicantConnectionV7 {
  edges: [JobApplicantEdgeV7!]!
  pageInfo: PageInfo!
  totalCount: Int!
  accessStatus: CandidateAccessStatus!
}

input UnlockCandidateProfileInput {
  organisationId: ID!
  candidateProfileId: ID!
  jobPostingId: ID
  source: String
  idempotencyKey: String!
}

extend type Query {
  candidateAccessStatus(organisationId: ID!): CandidateAccessStatus!
  jobApplicantsV7(
    organisationId: ID!
    jobPostingId: ID!
    first: Int = 20
    after: String
  ): JobApplicantConnectionV7!
}

extend type Mutation {
  unlockCandidateProfile(
    input: UnlockCandidateProfileInput!
  ): CandidateUnlockResult!
}

# Resolver policy - non-negotiable:
# 1) masked candidate lists never consume CANDIDATE_UNLOCK;
# 2) Organisation + Candidate is the distinct consumption key;
# 3) first five distinct candidates are free organisation-wide and never reset;
# 4) sixth distinct candidate returns PAYWALL_REQUIRED unless a paid/add-on entitlement permits it;
# 5) candidate consent/block/privacy is evaluated before commercial entitlement;
# 6) contact reveal remains a separately audited operation and may have its own paid entitlement.
