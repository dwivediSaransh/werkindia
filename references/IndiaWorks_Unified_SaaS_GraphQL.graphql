  applicationGate: ApplicationGate = WARN
  ownershipRequired: Boolean = false
}
input JobEducationRequirementInput {
  educationLevelCode: String!
  courseCode: String
  level: RequirementLevel!
  applicationGate: ApplicationGate = WARN
}
input JobLanguageRequirementInput {
  languageCode: String!
  minProficiency: String
  level: RequirementLevel!
  applicationGate: ApplicationGate = WARN
}
input CompensationComponentInput {
  componentType: String!
  minAmount: Decimal
  maxAmount: Decimal
  frequency: String
  description: String
}
input CompensationPackageInput {
  currency: String! = "INR"
  payFrequency: String!
  fixedMin: Decimal
  fixedMax: Decimal
  grossMin: Decimal
  grossMax: Decimal
  displayedInHandMin: Decimal
  displayedInHandMax: Decimal
  components: [CompensationComponentInput!]
}
input CreateJobPostingInput {
  organisationId: ID!
  roleId: ID!
  specialisationId: ID
  workContextId: ID
  engagementType: EngagementType!
  workMode: WorkMode!
  vacancyCount: Int!
  hiringUrgency: HiringUrgency!
  targetStartDate: Date
  applicationCloseDate: Date
  locations: [JobLocationInput!]!
  experience: JobExperienceRequirementInput!
  education: [JobEducationRequirementInput!]
  languages: [JobLanguageRequirementInput!]
  skills: [JobSkillRequirementInput!]
  credentials: [JobCredentialRequirementInput!]
  assets: [JobAssetRequirementInput!]
  compensation: CompensationPackageInput!
  description: String!
}
input PromoteJobInput {
  organisationId: ID!
  jobPostingId: ID!
  promotionProductId: ID!
  startsAt: DateTime
  durationHours: Int
  paymentMode: String = "ENTITLEMENT"
  idempotencyKey: String!
}

# ----- Inputs: candidate discovery/application -----
input JobLocationFilterInput {
  geographyIds: [ID!]
  latitude: Decimal
  longitude: Decimal
  radiusKm: Decimal
}
input SalaryFilterInput {
  monthlyMin: Decimal
  monthlyMax: Decimal
}
input ExperienceFilterInput {
  bucket: String
  minMonths: Int
  maxMonths: Int
}
input JobSearchInput {
  query: String
  jobFamilyIds: [ID!]
  roleIds: [ID!]
  specialisationIds: [ID!]
  organisationIndustryCodes: [String!]
  employerSectors: [String!]
  educationLevelCodes: [String!]
  educationCourseCodes: [String!]
  experience: ExperienceFilterInput
  engagementTypes: [EngagementType!]
  workModes: [WorkMode!]
  hiringUrgency: [HiringUrgency!]
  workplaceTags: [String!]
  location: JobLocationFilterInput
  salary: SalaryFilterInput
  shiftTypes: [String!]
  sort: JobSort = RELEVANCE
}
input CandidateLocationSearchInput {
  geographyIds: [ID!]
  latitude: Decimal
  longitude: Decimal
  radiusKm: Decimal
  willingToRelocate: Boolean
}
input CandidateSkillFilterInput {
  skillId: ID!
  minProficiency: String
  minMonthsExperience: Int
  mandatory: Boolean = true
}
input CandidateCredentialFilterInput {
  credentialTypeId: ID!
  verifiedOnly: Boolean = false
  activeOnly: Boolean = true
}
input CandidateSearchInput {
  jobPostingId: ID
  roleIds: [ID!]
  specialisationIds: [ID!]
  engagementTypes: [EngagementType!]
  workModes: [WorkMode!]
  location: CandidateLocationSearchInput
  skillFilters: [CandidateSkillFilterInput!]
  credentialFilters: [CandidateCredentialFilterInput!]
  languageCodes: [String!]
  minExperienceMonths: Int
  maxNoticePeriodDays: Int
  verifiedOnly: Boolean = false
}
input ApplyToJobInput {
  jobPostingId: ID!
  source: String
  screeningAnswers: [ApplicationAnswerInput!]
  idempotencyKey: String!
}
input ApplicationAnswerInput {
  requirementKey: String!
  answer: JSON!
}
input JobAlertInput {
  name: String
  filter: JobSearchInput!
  channel: AlertChannel!
  frequency: AlertFrequency!
}

# ----- Queries -----
type Query {
  plans: [SubscriptionPlan!]!
  meOrganisations: [OrganisationMembership!]!
  organisationSubscription(organisationId: ID!): OrganisationSubscription
  entitlementUsage(organisationId: ID!): [EntitlementUsage!]!
  billingInvoices(
    organisationId: ID!
    first: Int = 20
    after: String
  ): [BillingInvoice!]!

  myJobs(
    organisationId: ID!
    statuses: [JobPostingStatus!]
    first: Int = 20
    after: String
  ): [JobPosting!]!
  promotionProducts(organisationId: ID!): [PromotionProduct!]!

  candidateSearch(
    organisationId: ID!
    input: CandidateSearchInput!
    first: Int = 20
    after: String
  ): CandidateSearchConnection!
  jobCandidateMatches(
    organisationId: ID!
    jobPostingId: ID!
    first: Int = 20
    after: String
  ): CandidateSearchConnection!

  meCandidate: CandidateProfile
  jobFeed(
    input: JobSearchInput
    first: Int = 20
    after: String
  ): JobFeedConnection!
  jobSearch(
    input: JobSearchInput!
    first: Int = 20
    after: String
  ): JobFeedConnection!
  job(id: ID!): JobPosting
  prepareJobApplication(jobPostingId: ID!): CandidateJobMatch!
  myApplications(
    status: [ApplicationStatus!]
    first: Int = 20
    after: String
  ): CandidateApplicationConnection!
}

# ----- Mutations -----
type Mutation {
  requestCandidateOtp(
    mobile: String!
    purpose: String = "LOGIN"
  ): OtpChallengeResult!
  verifyCandidateOtp(
    challengeId: ID!
    otp: String!
    acceptedNoticeVersion: String!
  ): AuthSession!
  requestEmployerOtp(
    identifier: String!
    channel: String!
    purpose: String = "LOGIN"
  ): OtpChallengeResult!
  verifyEmployerOtp(
    challengeId: ID!
    otp: String!
    acceptedNoticeVersion: String!
  ): AuthSession!

  createOrganisation(input: CreateOrganisationInput!): Organisation!
  startTrial(input: StartTrialInput!): OrganisationSubscription!
  createSubscriptionCheckout(input: CreateCheckoutInput!): CheckoutSession!
  changeSubscriptionPlan(input: ChangePlanInput!): OrganisationSubscription!
  cancelSubscription(
    organisationId: ID!
    atPeriodEnd: Boolean = true
  ): OrganisationSubscription!

  createJobPosting(input: CreateJobPostingInput!): JobPosting!
  publishJob(
    organisationId: ID!
    jobPostingId: ID!
    idempotencyKey: String!
  ): JobPosting!
  pauseJob(organisationId: ID!, jobPostingId: ID!): JobPosting!
  closeJob(organisationId: ID!, jobPostingId: ID!, reason: String): JobPosting!
  promoteJob(input: PromoteJobInput!): JobPromotion!

  revealCandidateContact(
    organisationId: ID!
    candidateProfileId: ID!
    jobPostingId: ID
    idempotencyKey: String!
  ): RevealedCandidateContact!
  shortlistCandidate(
    organisationId: ID!
    candidateProfileId: ID!
    jobPostingId: ID
  ): Boolean!

  applyToJob(input: ApplyToJobInput!): CandidateApplication!
  withdrawApplication(applicationId: ID!, reason: String): CandidateApplication!
  updateApplicationStatus(
    organisationId: ID!
    applicationId: ID!
    status: ApplicationStatus!
    note: String
  ): CandidateApplication!

  createJobAlert(input: JobAlertInput!): ID!
  contactEmployer(
    jobPostingId: ID!
    applicationId: ID
    channel: ContactChannel!
  ): JSON!
}

