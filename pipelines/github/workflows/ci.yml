name: IndiaWorks CI
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend:
    runs-on: windows-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ChangeMe!LocalDev99"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "sqlcmd -C -S localhost -U sa -P ChangeMe!LocalDev99 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Restore
        run: dotnet restore IndiaWorks.slnx

      - name: Build
        run: dotnet build IndiaWorks.slnx -c Debug --no-restore

      - name: Format check
        run: dotnet format --verify-no-changes -v quiet

      - name: Test
        run: dotnet test IndiaWorks.slnx -c Debug --no-build --verbosity minimal

      - name: EF migrations list
        run: |
          dotnet ef migrations list `
            --project src/backend/IndiaWorks.Infrastructure `
            --startup-project src/backend/IndiaWorks.Api

      - name: Validate migrations apply (empty DB)
        env:
          ConnectionStrings__IndiaWorksDb: "Server=localhost,1433;Database=IndiaWorks_CiValidation;User Id=sa;Password=ChangeMe!LocalDev99;TrustServerCertificate=True;"
        run: |
          dotnet ef database update `
            --project src/backend/IndiaWorks.Infrastructure `
            --startup-project src/backend/IndiaWorks.Api

      - name: Archive GraphQL schema
        run: |
          mkdir schema-artifact
          curl -s -X POST -H "Content-Type: application/json" `
            -d '{"query":"{ __schema { types { name } } }"}' `
            http://localhost:5000/graphql -o schema-artifact/schema-query.json
        env:
          CI: true
        continue-on-error: true

      - name: Upload GraphQL schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphql-schema
          path: schema-artifact/
        if: always()

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/web

      - name: Lint (prettier --check)
        run: npm run lint
        working-directory: src/web

      - name: Format check
        run: npm run format -- --check
        working-directory: src/web

      - name: Typecheck (ng build)
        run: npm run typecheck
        working-directory: src/web

      - name: Unit tests
        run: npm test -- --run
        working-directory: src/web

      - name: Production build
        run: npm run build
        working-directory: src/web
