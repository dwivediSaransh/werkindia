type Query {
  version: String!
  health: String!
  myOrganisations: [OrganisationSummary!]!
}

type Mutation {
  echo(input: String!): String!
  createOrganisation(input: CreateOrganisationInput!): CreateOrganisationPayload!
}

type OrganisationSummary {
  id: ID!
  legalName: String!
  tradeName: String
  sector: String
  employeeBand: String
  organisationType: String
  nic2025Code: String
  verificationStatus: String!
  createdAt: DateTime!
  role: String!
}

type CreateOrganisationPayload {
  isActive: Boolean!
  organisationId: ID
  legalName: String
  tradeName: String
  sector: String
  employeeBand: String
  role: String
  createdAt: DateTime
  errorCode: String
  errorMessage: String
}

input CreateOrganisationInput {
  creatorUserAccountId: UUID!
  legalName: String!
  tradeName: String
  sector: EmployerSectorInput
  employeeBand: String
  organisationType: String
  nic2025Code: String
}

enum EmployerSectorInput {
  Private
  Government
  Psu
  Ngo
  Household
}

scalar UUID
scalar DateTime

