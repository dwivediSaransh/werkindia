  pendingInvitations(
    organisationId: UUID!
    callerUserAccountId: UUID!
  ): [OrganisationInvitationSummary!]!
}

type Mutation {
  echo(input: String!): String!
  createOrganisation(input: CreateOrganisationInput!): CreateOrganisationPayload!
  inviteMember(input: InviteMemberInput!): InviteMemberPayload!
  acceptInvitation(input: AcceptInvitationInput!): AcceptInvitationPayload!
  revokeInvitation(input: RevokeInvitationInput!): RevokeInvitationPayload!
}

type OrganisationSummary {
  id: ID!
  legalName: String!
  tradeName: String
  sector: String
  employeeBand: String
