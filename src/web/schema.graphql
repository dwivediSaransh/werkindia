  taxonomyVersions: [TaxonomyVersionSummary!]!
  geographies(type: GeographyType, search: String, hasCoordinates: Boolean): [GeographySummary!]!
  geographyHierarchy(type: GeographyType, search: String): [GeographySummary!]!
}
