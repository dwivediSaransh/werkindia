  createdAt: DateTime!
}

type CreateOrganisationPayload {
  isActive: Boolean!
  organisationId: ID
  legalName: String
  tradeName: String
  sector: String
  employeeBand: String
  role: String
  createdAt: DateTime
  errorCode: String
  errorMessage: String
}

type InviteMemberPayload {
  isSuccess: Boolean!
