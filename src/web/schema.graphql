  errorCode: String
  errorMessage: String
}

type AcceptInvitationPayload {
  isSuccess: Boolean!
  organisationId: ID
  role: String
  errorCode: String
  errorMessage: String
}

type RevokeInvitationPayload {
  isSuccess: Boolean!
  errorCode: String
  errorMessage: String
}

input CreateOrganisationInput {
  creatorUserAccountId: UUID!
  legalName: String!
  tradeName: String
  sector: EmployerSectorInput
  employeeBand: String
  organisationType: String
  nic2025Code: String
}

input InviteMemberInput {
  organisationId: UUID!
  invitedByUserAccountId: UUID!
  inviteeIdentifierType: String!
  inviteeIdentifierHash: [Int!]!
  role: String!
  tokenHash: [Int!]!
  expiresAt: DateTime!
}

input AcceptInvitationInput {
  invitationId: UUID!
  acceptedByUserAccountId: UUID!
}

input RevokeInvitationInput {
  invitationId: UUID!
  revokedByUserAccountId: UUID!
}

enum GeographyType {
  Country
  State
  District
  City
  Locality
  Pin
}

scalar Long

