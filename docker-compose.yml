services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu22.04
    container_name: indiaworks-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ChangeMe!LocalDev99}"
    ports:
      - "1433:1433"
    volumes:
      - indiaworks_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-ChangeMe!LocalDev99}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  indiaworks_sql_data:
